name: Thermo5 digital verification

on:
  push:
    branches: ['thermo5']
  workflow_dispatch:
  pull_request:
    paths:
      - 'rtl/**'
      - 'dv/uvm/**'
      - 'tools/hw/**'
      - '.github/workflows/thermo5-dv.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax and whitespace
        run: |
          python -m py_compile dv/uvm/sim/run_thermo5_dv_package.py dv/uvm/sim/run_thermo5_gap_closure.py dv/uvm/sim/run_thermo5_fault_detection_vcs.py dv/uvm/sim/package_thermo5_ef2_qualification.py dv/uvm/sim/package_thermo5_linux_signoff.py dv/uvm/formal/run_thermo5_scoped_formal.py tools/hw/thermo5_audit_reports.py tools/hw/thermo5_coverage_denominator.py tools/hw/thermo5_long_counter_delta.py
          git diff --check
      - name: Python thermo5 reference-model tests
        run: PYTHONPATH=dv/uvm/refmodel/python python -m unittest discover -s dv/uvm/refmodel/python/tests -v

  licensed-dv:
    # Enable only on a trusted licensed runner. No vendor models, vectors,
    # tool logs, or licenses are installed on the public hosted runner.
    if: (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/thermo5') && vars.THERMO5_LICENSED_CI == 'enabled'
    runs-on: [self-hosted, linux, synopsys]
    steps:
      - uses: actions/checkout@v4
      - name: Stage local independent oracle sets
        env:
          THERMO5_VECTOR_ROOT: ${{ vars.THERMO5_VECTOR_ROOT }}
        shell: bash -il {0}
        run: |
          test -n "$THERMO5_VECTOR_ROOT"
          mkdir -p runs/uvm_thermo5_i2_d1 runs/uvm_thermo5_payload_20261003 runs/uvm_thermo5_extreme_20261003
          cp -R "$THERMO5_VECTOR_ROOT/base" runs/uvm_thermo5_i2_d1/vectors
          for seed in 101 202 303; do
            cp -R "$THERMO5_VECTOR_ROOT/vectors_seed$seed" "runs/uvm_thermo5_payload_20261003/vectors_seed$seed"
          done
          cp "$THERMO5_VECTOR_ROOT/endpoint/"*.mem runs/uvm_thermo5_extreme_20261003/
      - name: Smoke, scoreboard, compiler lint diagnostics, and scoped formal
        env:
          THERMO5_XPM_ROOT: ${{ vars.THERMO5_XPM_ROOT }}
          THERMO5_RANGE_VECTORS: ${{ vars.THERMO5_RANGE_VECTORS }}
          THERMO5_GAIN_VECTORS: ${{ vars.THERMO5_GAIN_VECTORS }}
          THERMO5_GAIN_TOGGLE_VECTORS: ${{ vars.THERMO5_GAIN_TOGGLE_VECTORS }}
        shell: bash -il {0}
        run: |
          source "$HOME/.bashrc"
          python3.12 dv/uvm/sim/run_thermo5_dv_package.py --xpm-root "$THERMO5_XPM_ROOT" --range-vectors "$THERMO5_RANGE_VECTORS" --range-words 16387 --gain-vectors "$THERMO5_GAIN_VECTORS" --gain-toggle-vectors "$THERMO5_GAIN_TOGGLE_VECTORS" --unbounded-counter --residual-only --out-dir "runs/ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
      - name: SpyGlass frozen SKU lint
        shell: bash -il {0}
        run: |
          source "$HOME/.bashrc"
          export THERMO5_LINT_RUN="$PWD/runs/ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}/lint"
          mkdir -p "$THERMO5_LINT_RUN"
          sg_shell -tcl dv/uvm/sim/run_thermo5_spyglass.tcl > "$THERMO5_LINT_RUN/spyglass.log" 2>&1
          python3.12 tools/hw/thermo5_lint_summary.py "$THERMO5_LINT_RUN/moresimple.rpt"
      - name: Current EF2 generic regression, qualification, and pair proof
        if: always()
        shell: bash -il {0}
        run: |
          source "$HOME/.bashrc"
          ef2_root="$PWD/runs/ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}/ef2"
          generic_vectors="$ef2_root/vectors/generic"
          mkdir -p "$ef2_root"
          python3.12 dv/uvm/refmodel/python/generate_thermo5_frontend_vectors.py \
            --output-dir "$generic_vectors" --words 56 --seed 610216 \
            --interp-mode centered_cubic --tidsm-order 2 --step 5120 \
            --frame-start-words 1,15,36 --frame-gains 16384,14336,12288
          make -C dv/uvm/sim thermo5-vcs-regression PYTHON=python3.12 \
            THERMO5_CENTERED_CUBIC=1 THERMO5_TIDSM_ORDER=2 THERMO5_STEP=5120 \
            THERMO5_FIFO_IMPL=generic THERMO5_VECTORS="$generic_vectors" \
            THERMO5_OUT="$ef2_root/generic_vcs"
          make -C dv/uvm/sim thermo5-coverage-merge PYTHON=python3.12 \
            THERMO5_CENTERED_CUBIC=1 THERMO5_TIDSM_ORDER=2 THERMO5_STEP=5120 \
            THERMO5_FIFO_IMPL=generic THERMO5_VECTORS="$generic_vectors" \
            THERMO5_OUT="$ef2_root/generic_vcs"
          make -C dv/uvm/sim thermo5-axil-stop-restart-vcs-run PYTHON=python3.12 \
            THERMO5_STOP_RESTART_TIDSM_ORDER=2 THERMO5_STOP_RESTART_STEP=5120 \
            THERMO5_STOP_RESTART_VECTORS="$ef2_root/vectors/stop_restart" \
            THERMO5_OUT="$ef2_root/stop_restart_vcs"
          make -C dv/uvm/sim thermo5-ef2-qualification PYTHON=python3.12 \
            THERMO5_OUT="$ef2_root/qualification_vcs" \
            THERMO5_EF2_SUSTAINED_VECTORS="$ef2_root/vectors/qualification/sustained" \
            THERMO5_EF2_RANDOM_VECTORS="$ef2_root/vectors/qualification/random" \
            THERMO5_EF2_EXTREME_VECTORS="$ef2_root/vectors/qualification/extreme"
          make -C dv/uvm/sim thermo5-ef2-pair-vcs PYTHON=python3.12 \
            THERMO5_EF2_PAIR_OUT="$ef2_root/pair_lookahead_vcs"
          make -C dv/uvm/sim thermo5-ef2-serdes-vcs PYTHON=python3.12 \
            THERMO5_EF2_SERDES_DIR="$ef2_root/serdes_vcs"
          make -C dv/uvm/sim thermo5-gt-parent-link-fault-vcs \
            GT_PARENT_FAULT_OUT="$ef2_root/gt_parent_fault_vcs"
          PATH="/opt/Synopsys/vc_formal/V-2023.12-SP2/bin:$PATH" \
            python3.12 dv/uvm/formal/run_thermo5_scoped_formal.py \
            --jobs ef2 ef2_pair --out-dir "$ef2_root/formal"
          python3.12 dv/uvm/sim/package_thermo5_linux_signoff.py \
            --repo-root "$PWD" \
            --generic-regression-dir "$ef2_root/generic_vcs" \
            --generic-vectors "$generic_vectors" \
            --stop-restart-dir "$ef2_root/stop_restart_vcs" \
            --stop-restart-vectors "$ef2_root/vectors/stop_restart" \
            --pair-lookahead-dir "$ef2_root/pair_lookahead_vcs" \
            --serdes-dir "$ef2_root/serdes_vcs" \
            --gt-parent-dir "$ef2_root/gt_parent_fault_vcs" \
            --qualification-manifest "$ef2_root/qualification_vcs/qualification_manifest.json" \
            --formal-summary "$ef2_root/formal/formal_summary.json" \
            --output "$ef2_root/signoff_manifest.json"
      - name: Archive current EF2 signoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thermo5-ef2-signoff-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            runs/ci_*/ef2/signoff_manifest.json
            runs/ci_*/ef2/vectors/**/*.mem
            runs/ci_*/ef2/generic_vcs/*.log
            runs/ci_*/ef2/generic_vcs/coverage/dashboard.html
            runs/ci_*/ef2/generic_vcs/coverage/grp*.html
            runs/ci_*/ef2/stop_restart_vcs/*.log
            runs/ci_*/ef2/pair_lookahead_vcs/compile.log
            runs/ci_*/ef2/pair_lookahead_vcs/sim.log
            runs/ci_*/ef2/serdes_vcs/*.mem
            runs/ci_*/ef2/serdes_vcs/compile.log
            runs/ci_*/ef2/serdes_vcs/sim.log
            runs/ci_*/ef2/gt_parent_fault_vcs/compile.log
            runs/ci_*/ef2/gt_parent_fault_vcs/run.log
            runs/ci_*/ef2/qualification_vcs/qualification_manifest.json
            runs/ci_*/ef2/qualification_vcs/*.log
            runs/ci_*/ef2/qualification_vcs/ef2_qualification_coverage/dashboard.html
            runs/ci_*/ef2/qualification_vcs/ef2_qualification_coverage/grp*.html
            runs/ci_*/ef2/formal/formal_summary.json
            runs/ci_*/ef2/formal/ef2/console.log
            runs/ci_*/ef2/formal/ef2/setup.txt
            runs/ci_*/ef2/formal/ef2/properties.txt
            runs/ci_*/ef2/formal/ef2_pair/console.log
            runs/ci_*/ef2/formal/ef2_pair/setup.txt
            runs/ci_*/ef2/formal/ef2_pair/properties.txt
      - name: Keep normalized results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thermo5-dv-summary
          path: |
            runs/ci_*/dv_package.json
            runs/ci_*/diagnostics.json
            runs/ci_*/coverage/coverage_summary.md
            runs/ci_*/formal/formal_summary.json
            runs/ci_*/lint/lint_summary.json
